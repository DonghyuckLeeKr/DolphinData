<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DolphinData 개발 관리자</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><main>
  <header><div><span class="eyebrow">DOLPHINDATA · 이 PC에서 운영</span><h1>개발 자동화</h1><p>사용자 기록을 확인하고, 수정본을 검사한 뒤 승인합니다.</p></div><button id="refresh" class="secondary">상태 새로고침</button></header>
  <section aria-label="연결 상태" id="connections" class="connections"></section>
  <section class="intake"><div><h2>진단 리포트 가져오기</h2><p>앱의 설정 → 문제 진단에서 내보낸 JSON을 선택해주세요. 사용자 설명은 이 PC에 보관하며 AI에 전송하지 않습니다.</p></div><label class="file-button">파일 선택<input id="file" type="file" accept=".json,application/json"></label></section>
  <p id="message" role="status" aria-live="polite"></p>
  <section id="reports" aria-label="리포트 목록"></section>
  <footer>자동 수정은 검토용 브랜치에서 진행됩니다. 수정 승인 후에도 GitHub 배포 승인이 필요합니다. USB 장치의 실제 동작은 설치파일로 확인해주세요.</footer>
</main></body></html>

[package]
name = "data-usage-counter"
version = "1.3.2"
description = "Dolphin Data - Real-time Network & LTE Data Monitor"
authors = ["DolphinData contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-close", "window-show", "window-set-size", "window-set-always-on-top",
  "notification-all",
  "shell-open",
  "system-tray",
  "updater",
  "window-hide",
  "window-maximize",
  "window-minimize",
  "window-start-dragging",
  "window-unmaximize"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Shell"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
